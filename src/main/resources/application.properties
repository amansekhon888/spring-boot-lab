spring.application.name = demo
server.port = 8080

# In-memory database setup
spring.datasource.url = jdbc:h2:mem:testdb
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect
spring.h2.console.enabled = true
spring.jpa.hibernate.ddl-auto = update
spring.data.web.pageable.max-page-size = 100

# Ehcache uses a bounded heap and a five-minute time-to-live from ehcache.xml.
spring.cache.type = jcache
spring.cache.jcache.config = classpath:ehcache.xml

# Demo-only fallback keys let the lab run locally. Supply strong base64-encoded
# 32-byte keys through environment variables before deploying anywhere real.
app.jwt.secret-base64 = ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.access-token-minutes = 15
app.jwt.refresh-token-days = 7
app.crypto.aes-key-base64 = ${AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.demo.user-password = ${DEMO_USER_PASSWORD:change-me-user}
app.demo.admin-password = ${DEMO_ADMIN_PASSWORD:change-me-admin}

# Publishing defaults use embedded H2 and local mock adapters; Compose overrides Kafka bootstrap.
spring.kafka.bootstrap-servers = ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages = com.example.demo.publishing
spring.kafka.consumer.properties.spring.json.value.default.type = com.example.demo.publishing.PublishEvent
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.producer.properties.enable.idempotence = true
spring.kafka.producer.retries = 10
spring.kafka.producer.properties.retry.backoff.ms = 500
spring.kafka.admin.auto-create = true
spring.kafka.listener.missing-topics-fatal = false
app.publishing.poll-ms = ${PUBLISHING_POLL_MS:3000}
app.publishing.outbox-ms = ${PUBLISHING_OUTBOX_MS:1000}

